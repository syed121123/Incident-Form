<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light only">
<title>stc Incident Report (IR27)</title>
<style>
  html{direction: ltr;}
  :root{
    color-scheme: light only;
    --purple-950:#2A0F45;
    --purple-800:#3D1A5B;
    --purple-700:#4C2172;
    --magenta:#E31C79;
    --magenta-dim:#F7D9E8;
    --paper:#FAF8FC;
    --card:#FFFFFF;
    --ink:#211A2B;
    --ink-dim:#6C6478;
    --line:#E7E1EE;
    --ok:#1E8E5A;
    --ok-bg:#E6F4EC;
    --bad:#D64545;
    --bad-bg:#FCE9E9;
    --na:#8A8294;
    --na-bg:#EFEDF2;
    --warn:#C9820F;
    --warn-bg:#FBF0DD;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;}

  /* ---------- top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(135deg,var(--purple-950),var(--purple-800) 60%,var(--magenta));
    color:#fff; padding:14px 16px 16px;
    box-shadow:0 4px 14px rgba(42,15,69,.25);
  }
  .topbar-row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .brand{display:flex; flex-direction:column; line-height:1.1;}
  .brand .eyebrow{font-size:11px; letter-spacing:.12em; text-transform:uppercase; opacity:.75; font-weight:600;}
  .brand h1{font-size:17px; margin:2px 0 0; font-weight:800; letter-spacing:.01em;}
  .meta-row{display:flex; gap:8px; margin-top:12px; overflow-x:auto; padding-bottom:2px;}
  .meta-field{flex:1 1 0; min-width:120px;}
  .meta-field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; margin-bottom:3px; font-weight:700;}
  .meta-field input{
    width:100%; padding:9px 10px; border-radius:9px; border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12); color:#fff; font-size:14px; font-weight:600;
  }
  .meta-field input::placeholder{color:rgba(255,255,255,.6); font-weight:500;}
  .meta-field input:focus{outline:2px solid #fff; background:rgba(255,255,255,.2);}

  /* ---------- layout ---------- */
  .wrap{max-width:640px; margin:0 auto; padding:14px 12px 120px;}
  .section{background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden;}
  .section-head{
    padding:12px 14px; background:var(--purple-800); color:#fff; font-weight:800; font-size:14px;
  }
  .section-body{padding:14px;}
  .field{margin-bottom:12px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--purple-800); margin-bottom:5px;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%; padding:10px 11px; border-radius:10px; border:1px solid var(--line);
    font-size:14px; background:#fcfbfd; color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:70px; line-height:1.4;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}

  /* ---------- timeline entries ---------- */
  .timeline-item{display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; padding:10px; background:#fcfbfd; border:1px solid var(--line); border-radius:10px;}
  .timeline-item input[type=time]{width:100px; flex:0 0 auto; padding:9px 8px; border-radius:8px; border:1px solid var(--line); font-size:13px;}
  .timeline-item input[type=text]{flex:1; padding:9px 10px; border-radius:8px; border:1px solid var(--line); font-size:13px;}
  .timeline-item .rm{
    flex:0 0 auto; width:30px; height:30px; border-radius:8px; border:1px solid var(--bad); background:var(--bad-bg);
    color:var(--bad); font-weight:800; cursor:pointer; font-size:14px;
  }
  .addrow-btn{
    width:100%; padding:10px; border-radius:10px; border:1.5px dashed var(--line); background:#fcfbfd;
    color:var(--purple-800); font-weight:700; font-size:13px; cursor:pointer;
  }

  /* ---------- photos ---------- */
  .photo-native-wrap{margin-top:4px; border:1.5px dashed var(--line); border-radius:10px; background:#fcfbfd; overflow:hidden;}
  .photo-native-label{padding:8px 10px 0; font-size:12.5px; font-weight:700; color:var(--purple-800);}
  .photo-native-input{
    display:block; width:100%; padding:8px 10px 10px; border:none; background:transparent;
    font-size:12.5px; color:var(--ink-dim); box-sizing:border-box;
  }
  .photo-strip{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .photo-thumb{position:relative; width:96px; height:96px; border-radius:12px; overflow:hidden; border:1px solid var(--line); box-shadow:0 2px 6px rgba(42,15,69,.10);}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; display:block; cursor:pointer;}
  .photo-thumb .rm{
    position:absolute; top:4px; right:4px; width:22px; height:22px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; border:none; font-size:12px; line-height:22px; text-align:center; padding:0; cursor:pointer;
  }

  /* ---------- patient highlight ---------- */
  .patient-note{font-size:11px; color:var(--ink-dim); margin-top:4px;}

  /* ---------- bottom bar ---------- */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    background:#fff; border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex; gap:10px; box-shadow:0 -6px 18px rgba(42,15,69,.08);
  }
  .btn-primary{
    flex:1; background:var(--magenta); color:#fff; border:none; border-radius:12px; padding:13px 16px;
    font-weight:800; font-size:15px; cursor:pointer;
  }
  .btn-secondary{
    background:#fff; color:var(--purple-800); border:1.5px solid var(--purple-800); border-radius:12px; padding:0 16px;
    font-weight:800; font-size:14px; cursor:pointer;
  }

  /* ---------- review / print view : stc report format ---------- */
  #reviewOverlay{position:fixed; inset:0; background:#DCD6E4; z-index:100; overflow:auto; display:none;}
  #reviewOverlay.show{display:block;}
  .review-head{background:linear-gradient(135deg,var(--purple-950),var(--purple-800)); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:5;}
  .review-head h2{margin:0; font-size:15px;}
  .closebtn{background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; flex:0 0 auto;}
  .review-body{max-width:760px; margin:0 auto; padding:14px 10px 24px;}

  /* ---------- IR27 exact-template report ---------- */
  .rpt-sheet{background:#fff; overflow-x:auto; box-shadow:0 6px 22px rgba(42,15,69,.18); margin-bottom:16px; min-width:0; border:1px solid #000; border-bottom:none;}
  .rpt-banner{display:flex; align-items:stretch; min-height:56px; background:var(--purple-800); border-bottom:1px solid #000;}
  .rpt-banner-left{flex:1; display:flex; align-items:center; justify-content:center; padding:10px 16px; border-right:1px solid #000;}
  .rpt-banner-left h1{color:#fff; font-size:20px; margin:0; letter-spacing:.02em; font-weight:800; text-transform:uppercase; text-align:center;}
  .rpt-banner-right{width:170px; background:#fff; display:flex; align-items:center; justify-content:center; padding:10px;}
  .rpt-logo-img{max-width:140px; max-height:56px; display:block;}

  table.ir-table{width:100%; min-width:760px; border-collapse:collapse; table-layout:fixed; font-size:12.5px; color:#000;}
  table.ir-table td{border:1px solid #000; padding:7px 9px; vertical-align:top; color:#000; background:#fff;}
  table.ir-table td.ir-lbl{font-weight:800; width:12%;}
  table.ir-table td.ir-val{width:18%;}
  table.ir-table td.ir-safety{text-align:center; vertical-align:middle;}
  .ir-safety-title{font-size:20px; font-weight:800; margin-bottom:4px;}
  .ir-safety-reportno{font-size:14px; font-weight:800;}

  table.ir-table td.ir-th{background:#D9D9D9; font-weight:800; text-transform:uppercase; text-align:center; letter-spacing:.02em;}
  table.ir-table td.ir-th-left{background:#D9D9D9; font-weight:800; text-transform:uppercase; text-align:left;}

  .ir-timeline-block{font-size:12.5px; line-height:1.55;}
  .ir-timeline-title{font-weight:800; text-decoration:underline; margin-bottom:2px;}
  .ir-timeline-row{font-weight:600;}
  .ir-action-title{font-weight:800; text-decoration:underline; margin-top:8px; margin-bottom:2px;}
  .ir-patient{color:#D6001C; font-weight:800; margin-top:8px;}

  .ir-photos-cell{padding:10px !important;}
  .ir-photos-grid{display:flex; flex-wrap:wrap; gap:10px;}
  .ir-photo-block{width:230px;}
  .ir-photo-block img{width:230px; height:230px; object-fit:cover; border:1px solid #999; display:block; cursor:pointer;}

  .rpt-footer-bar{height:8px; background:linear-gradient(90deg,var(--purple-800),var(--magenta));}
  .rpt-footer{padding:10px 14px; text-align:center; font-size:10.5px; color:var(--ink-dim); border-top:1px solid #E3DEEC;}

  .rv-actions{display:flex; flex-wrap:wrap; gap:10px; padding:4px 2px 24px;}
  .rv-actions button{min-width:130px;}
  .rv-help-note{
    background:#F1EDF6; border:1px solid #D8D2E2; border-radius:10px; padding:10px 12px;
    font-size:12.5px; color:var(--ink-dim); line-height:1.5; margin:14px 2px 4px;
  }
  .rv-help-note b{color:var(--purple-800);}

  @page{ size: A4 landscape; margin: 10mm; }

  @media print{
    .topbar,.bottombar,.closebtn,.rv-actions,.review-head,.rv-help-note,.wrap{display:none !important;}
    #reviewOverlay{position:static; overflow:visible; background:#fff;}
    .review-body{padding:0; max-width:100%;}
    body{background:#fff;}
    .rpt-sheet{box-shadow:none; margin-bottom:0; overflow-x:visible;}
    table.ir-table{min-width:0;}
    tr, td{page-break-inside:avoid;}
    .ir-photo-block{page-break-inside:avoid;}
    * { -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; }
  }

  .toast{
    position:fixed; bottom:82px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:9px 16px; border-radius:999px; font-size:13px; font-weight:600; z-index:200; opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .toast.show{opacity:1;}

  /* ---------- lightbox ---------- */
  #lightbox{position:fixed; inset:0; background:rgba(20,10,32,.94); z-index:300; display:none; align-items:center; justify-content:center; flex-direction:column; padding:20px;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:100%; max-height:80vh; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.5);}
  #lightbox .lb-cap{color:#fff; font-size:13px; font-weight:700; margin-top:14px;}
  #lightbox .lb-close{
    position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    background:rgba(255,255,255,.15); color:#fff; border:none; font-size:18px; cursor:pointer;
  }
</style>
</head>
<body>
<noscript>
  <div style="background:#D64545;color:#fff;padding:16px;font-family:sans-serif;font-size:14px;text-align:center;">
    This form needs JavaScript to load. Please open this file in Safari or Chrome instead of a quick preview.
  </div>
</noscript>

<div class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="eyebrow">stc &middot; Safety Department</div>
      <h1>Incident Report (IR27)</h1>
    </div>
  </div>
  <div class="meta-row">
    <div class="meta-field"><label>Date</label><input id="m-date" type="date"></div>
    <div class="meta-field"><label>Building No</label><input id="m-building" placeholder="e.g. A5 1F"></div>
    <div class="meta-field"><label>Report No</label><input id="m-reportno" placeholder="IR27 YY-MM-DD XX"></div>
  </div>
</div>

<div class="wrap">

  <div class="section">
    <div class="section-head">Incident Details</div>
    <div class="section-body">
      <div class="field-row">
        <div class="field"><label>Incident Date</label><input type="date" id="f-incdate"></div>
        <div class="field"><label>Incident Time</label><input type="time" id="f-inctime"></div>
      </div>
      <div class="field">
        <label>Description</label>
        <select id="f-description">
          <option value="">Select…</option>
          <option>FAA</option>
          <option>FAA-Dust Accumulation</option>
          <option>Panel Fault</option>
          <option>Medical</option>
          <option>Elevator Rescue</option>
          <option>Fire</option>
          <option>Smoke</option>
          <option>Bakhoor</option>
          <option value="Other">Other</option>
        </select>
        <input type="text" id="f-description-other" placeholder="Specify description…" style="display:none; margin-top:8px;">
      </div>
      <div class="field">
        <label>Respondent Name</label>
        <select id="f-respondent">
          <option value="">Select…</option>
          <option>RRT</option>
          <option>RRR and Meena</option>
          <option value="Other">Other</option>
        </select>
        <input type="text" id="f-respondent-other" placeholder="Specify respondent…" style="display:none; margin-top:8px;">
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Location</div>
    <div class="section-body">
      <div class="field"><label>Affected Buildings / Area / Items</label><input type="text" id="f-affected" placeholder="e.g. NONE"></div>
      <div class="field"><label>Location</label><input type="text" id="f-location" placeholder="e.g. A5 1F Ladies Lounge"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Reason</div>
    <div class="section-body">
      <div class="field"><textarea id="f-reason" placeholder="Brief reason for the incident…"></textarea></div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Response Time Sequence</div>
    <div class="section-body">
      <label style="display:block; font-size:12px; font-weight:700; color:var(--purple-800); margin-bottom:8px;">Timeline</label>
      <div id="timelineList"></div>
      <button class="addrow-btn" id="btnAddTimeline" type="button">+ Add timeline entry</button>

      <div class="field" style="margin-top:14px;">
        <label>Action Taken</label>
        <textarea id="f-action" placeholder="Describe the action taken in full…" style="min-height:110px;"></textarea>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Patient / Person Involved</div>
    <div class="section-body">
      <div class="field">
        <input type="text" id="f-patient" placeholder="Full name">
        <div class="patient-note">Shown in bold red in the final report, matching the official IR27 format.</div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-head">Incident Photos</div>
    <div class="section-body">
      <div class="photo-native-wrap">
        <div class="photo-native-label">📷 Add photo(s)</div>
        <input type="file" class="photo-native-input" id="photoInput" accept="image/*" multiple>
      </div>
      <div class="photo-strip" id="photoStrip"></div>
    </div>
  </div>

</div>

<div class="bottombar">
  <button class="btn-primary" id="btnFinish">Review &amp; finish</button>
</div>

<div id="reviewOverlay">
  <div class="review-head">
    <h2>Incident Report Preview</h2>
    <button class="closebtn" id="btnCloseReview">✕</button>
  </div>
  <div class="review-body" id="reviewBody"></div>
</div>

<div class="toast" id="toast"></div>

<div id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <img id="lbImg" src="" alt="Incident photo">
  <div class="lb-cap" id="lbCap"></div>
</div>

const $ = sel => document.querySelector(sel);
const el = (tag, cls, html) => { const e=document.createElement(tag); if(cls) e.className=cls; if(html!==undefined) e.innerHTML=html; return e; };

let state = {
  meta:{date:"", building:"", reportno:""},
  incident:{date:"", time:"", description:"", respondent:"", affected:"", location:"", reason:"", action:"", patient:""},
  timeline:[],
  photos:[]
};

function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}
function openLightbox(src, caption){
  $("#lbImg").src = src;
  $("#lbCap").textContent = caption || "";
  $("#lightbox").classList.add("show");
}
function closeLightbox(){ $("#lightbox").classList.remove("show"); }
$("#lbClose").onclick = closeLightbox;
$("#lightbox").addEventListener("click", (e)=>{ if(e.target.id === "lightbox") closeLightbox(); });

/* ---------------- meta fields ---------------- */
["date","building","reportno"].forEach(k=>{
  $("#m-"+k).addEventListener("input", ()=>{ state.meta[k] = $("#m-"+k).value; });
});
/* ---------------- incident fields ---------------- */
const fieldMap = {
  "f-incdate":"date", "f-inctime":"time",
  "f-affected":"affected", "f-location":"location", "f-reason":"reason", "f-action":"action", "f-patient":"patient"
};
Object.keys(fieldMap).forEach(id=>{
  $("#"+id).addEventListener("input", ()=>{ state.incident[fieldMap[id]] = $("#"+id).value; });
});

/* description / respondent: dropdown with an "Other" free-text fallback */
function wireDropdownWithOther(selectId, otherId, stateKey){
  const sel = $("#"+selectId);
  const other = $("#"+otherId);
  function sync(){
    if(sel.value === "Other"){
      other.style.display = "block";
      state.incident[stateKey] = other.value;
    }else{
      other.style.display = "none";
      state.incident[stateKey] = sel.value;
    }
  }
  sel.addEventListener("change", sync);
  other.addEventListener("input", sync);
  sync();
}
wireDropdownWithOther("f-description","f-description-other","description");
wireDropdownWithOther("f-respondent","f-respondent-other","respondent");

/* ---------------- timeline ---------------- */
function renderTimeline(){
  const list = $("#timelineList");
  list.innerHTML = "";
  state.timeline.forEach((row, idx)=>{
    const div = el("div","timeline-item");
    const timeInput = el("input"); timeInput.type="time"; timeInput.value = row.time;
    timeInput.oninput = ()=> row.time = timeInput.value;
    const textInput = el("input"); textInput.type="text"; textInput.placeholder="Event description"; textInput.value = row.event;
    textInput.oninput = ()=> row.event = textInput.value;
    const rm = el("button","rm","✕"); rm.type="button";
    rm.onclick = ()=>{ state.timeline.splice(idx,1); renderTimeline(); };
    div.appendChild(timeInput); div.appendChild(textInput); div.appendChild(rm);
    list.appendChild(div);
  });
}
$("#btnAddTimeline").onclick = ()=>{
  state.timeline.push({time:"", event:""});
  renderTimeline();
};
renderTimeline();

/* ---------------- photos ---------------- */
function renderPhotos(){
  const strip = $("#photoStrip");
  strip.innerHTML = "";
  state.photos.forEach((src, idx)=>{
    const th = el("div","photo-thumb");
    th.innerHTML = `<img src="${src}"><button class="rm">✕</button>`;
    th.querySelector("img").onclick = () => openLightbox(src, `Photo ${idx+1}`);
    th.querySelector(".rm").onclick = (ev) => { ev.stopPropagation(); state.photos.splice(idx,1); renderPhotos(); };
    strip.appendChild(th);
  });
}
function handlePhotoFiles(files){
  files = Array.from(files || []);
  if(!files.length) return;
  let remaining = files.length;
  files.forEach(file=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 1600;
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.8);
        state.photos.push(dataUrl);
        remaining--;
        if(remaining === 0){ renderPhotos(); }
      };
      img.onerror = ()=>{ remaining--; toast("Could not read that photo"); };
      img.src = ev.target.result;
    };
    reader.onerror = ()=>{ remaining--; toast("Could not read that photo"); };
    reader.readAsDataURL(file);
  });
}
$("#photoInput").addEventListener("change", (e)=>{
  handlePhotoFiles(e.target.files);
  e.target.value = "";
});

/* ---------------- download report ---------------- */
function downloadReportHtml(sheetEl){
  try{
    const styleTag = document.querySelector("style");
    const cssText = styleTag ? styleTag.innerHTML : "";
    const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="color-scheme" content="light only">
      <title>Incident Report</title>
      <style>${cssText}
        html,body{background:#fff; margin:0; padding:16px;}
        .rpt-sheet{box-shadow:none; margin-bottom:0;}
      </style></head>
      <body>${sheetEl.outerHTML}</body></html>`;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const rn = (state.meta.reportno || "incident-report").trim().replace(/\s+/g,"_");
    const a = document.createElement("a");
    a.href = url;
    a.download = `${rn}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
    toast("Report file downloaded");
  }catch(err){
    console.error("Download error", err);
    toast("Could not download the report");
  }
}

  `;

  sheet.querySelectorAll(".ir-photo-block img").forEach(img=>{
    const idx = parseInt(img.dataset.idx, 10);
    img.style.cursor = "pointer";
    img.onclick = () => openLightbox(state.photos[idx], `Photo ${idx+1}`);
  });

  const footer = el("div","rpt-footer","Internal &middot; General Department of Security and Safety &middot; stc");
  sheet.appendChild(footer);

  body.appendChild(sheet);

  const helpNote = el("div","rv-help-note",
    "<b>Print</b> opens your device's print dialog directly. If that doesn't respond, use <b>Download Report</b> to save the file, then open it and print/share from there.");
  body.appendChild(helpNote);

  const actions = el("div","rv-actions");
  const printBtn = el("button","btn-primary","🖨 Print / Save as PDF");
  printBtn.style.flex="1";
  printBtn.type="button";
  printBtn.onclick = ()=> window.print();
  const downloadBtn = el("button","btn-secondary","⬇ Download Report");
  downloadBtn.style.flex="1";
  downloadBtn.type="button";
  downloadBtn.onclick = ()=> downloadReportHtml(sheet);
  const backBtn = el("button","btn-secondary","Back to form");
  backBtn.style.flex="1";
  backBtn.type="button";
  backBtn.onclick = closeReview;
  actions.appendChild(printBtn);
  actions.appendChild(downloadBtn);
  actions.appendChild(backBtn);
  body.appendChild(actions);

  $("#reviewOverlay").classList.add("show");
};
function closeReview(){ $("#reviewOverlay").classList.remove("show"); }
$("#btnCloseReview").onclick = closeReview;

/* ---------------- init ---------------- */
function boot(){
  try{
    const today = new Date().toISOString().slice(0,10);
    $("#m-date").value = today;
    state.meta.date = today;
    $("#f-incdate").value = today;
    state.incident.date = today;
  }catch(err){
    console.error("Init error", err);
    document.body.insertAdjacentHTML("afterbegin",
      '<div style="background:#D64545;color:#fff;padding:12px 16px;font-size:13px;font-weight:600;">'+
      'This page needs to run in a full browser. Tap Share → Open in Safari (or your browser) instead of the quick preview.</div>');
  }
}
if(document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", boot);
}else{
  boot();
}
</script>
</body>
</html>
